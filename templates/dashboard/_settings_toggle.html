{% comment %}
Variables: name, label, desc, checked (True/False), badge (optional)
{% endcomment %}
<label class="flex items-start gap-4 p-4 rounded-xl border border-gray-800 hover:border-gray-700 bg-gray-900/40 hover:bg-gray-900/70 transition-all cursor-pointer group" data-setting="{{ label }}">
    <div class="relative flex-shrink-0 mt-0.5">
        <input type="checkbox" name="{{ name }}" value="1" {% if checked %}checked{% endif %}
               class="peer sr-only">
        <div class="w-10 h-5 bg-gray-700 rounded-full peer-checked:bg-primary transition-colors duration-200
                    peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-gray-900"></div>
        <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200
                    peer-checked:translate-x-5"></div>
    </div>
    <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-300 group-hover:text-gray-200 transition-colors">{{ label }}</span>
            {% if badge %}
            <span class="px-1.5 py-0.5 text-[10px] font-semibold text-gray-500 bg-gray-800 border border-gray-700 rounded">{{ badge }}</span>
            {% endif %}
        </div>
        {% if desc %}
        <p class="mt-0.5 text-xs text-gray-600">{{ desc }}</p>
        {% endif %}
    </div>
</label>
