{% load static %}
<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Inválido — Fuet Mágico</title>
    <link rel="icon" type="image/x-icon" href="{% static 'website/favicon/favicon.ico' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#dbc693', 'primary-dark': '#c9b580' } } }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-900 flex items-center justify-center px-4">

<div class="w-full max-w-md text-center">
    <div class="text-center mb-8">
        <span class="text-3xl font-bold bg-gradient-to-r from-primary to-yellow-600 bg-clip-text text-transparent">Fuet Mágico</span>
    </div>

    <div class="bg-gray-800 rounded-2xl border border-red-700/40 shadow-2xl px-8 py-10">
        <div class="w-14 h-14 bg-red-500/15 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h1 class="text-xl font-bold text-white mb-2">Link Inválido ou Expirado</h1>
        <p class="text-gray-400 text-sm mb-6">
            Este link de reset de password já não é válido. Pode ter sido usado anteriormente ou ter expirado (válido por 3 dias).
        </p>
        <p class="text-sm text-gray-500">
            Pede ao administrador que envie um novo link de reset.
        </p>
        <a href="/accounts/login/"
           class="mt-6 inline-block px-6 py-2.5 bg-primary text-gray-900 font-semibold rounded-xl hover:bg-primary-dark transition text-sm">
            Ir para o Login
        </a>
    </div>
</div>

</body>
</html>
