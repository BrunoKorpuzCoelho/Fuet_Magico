{% load static %}
<div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-14">
            <!-- Left: Navigation + Form Actions -->
            <div class="flex items-center space-x-6">
                <a href="{% url 'inventory:product_list' %}" 
                   class="text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors">
                    Produtos
                </a>

                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open" 
                            class="flex items-center space-x-1 text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors">
                        <span>Configuração</span>
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    
                    <div x-show="open" 
                         @click.away="open = false"
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="opacity-0 scale-95"
                         x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="opacity-100 scale-100"
                         x-transition:leave-end="opacity-0 scale-95"
                         class="absolute right-0 sm:left-0 mt-2 w-56 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 z-50"
                         style="display: none;">
                        <div class="py-1">
                            <a href="{% url 'inventory:category_list' %}" 
                               class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Categorias
                            </a>
                            <a href="{% url 'inventory:uom_list' %}" 
                               class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Unidades de Medida
                            </a>
                            <a href="{% url 'inventory:uom_category_list' %}" 
                               class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Categorias UdM
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Botões de Ação (Descartar + Guardar) -->
                <div class="flex items-center gap-3 ml-2" id="form-action-buttons">
                    <!-- Descartar (Vermelho) -->
                    <a href="{% if product %}{% url 'inventory:product_edit' product.pk %}{% else %}{% url 'inventory:product_list' %}{% endif %}" 
                       class="flex items-center justify-center hover:opacity-80 transition-opacity" 
                       title="Descartar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-red-500">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                            <line x1="10" x2="10" y1="11" y2="17"></line>
                            <line x1="14" x2="14" y1="11" y2="17"></line>
                        </svg>
                    </a>
                    <!-- Guardar (Verde) -->
                    <button type="submit" 
                            form="product-form"
                            class="flex items-center justify-center hover:opacity-80 transition-opacity" 
                            title="Guardar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-green-500">
                            <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
                            <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"></path>
                            <path d="M7 3v4a1 1 0 0 0 1 1h7"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Right: Smart Buttons -->
            <div class="flex items-center gap-2">
                <!-- Lista de Materiais (BOM) -->
                <button class="flex items-center gap-2 px-3 py-1 rounded-md border border-purple-500 bg-transparent hover:bg-purple-500/10 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-purple-400">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" x2="8" y1="13" y2="13"></line>
                        <line x1="16" x2="8" y1="17" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span class="text-sm font-semibold text-purple-400">{{ bom_count|default:0 }}</span>
                    <span class="text-xs text-purple-400">BOM</span>
                </button>

                <!-- Previsão (Forecast) -->
                {% if product.pk %}
                <a href="{% url 'inventory:product_forecast' product.pk %}"
                   class="flex items-center gap-2 px-3 py-1 rounded-md border border-blue-500 bg-transparent hover:bg-blue-500/10 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-blue-400">
                        <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path>
                    </svg>
                    <span class="text-sm font-semibold text-blue-400">{{ forecast_count|floatformat:'-3' }}</span>
                    <span class="text-xs text-blue-400">Previsão</span>
                </a>
                {% endif %}

                <!-- Unidades Vendidas -->
                <button class="flex items-center gap-2 px-3 py-1 rounded-md border border-green-500 bg-transparent hover:bg-green-500/10 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-green-400">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                        <path d="M3 6h18"></path>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span class="text-sm font-semibold text-green-400">{{ sold_count|default:0 }}</span>
                    <span class="text-xs text-green-400">Vendidas</span>
                </button>

                <!-- Em Stock (On-Hand) -->
                <a href="{% url 'inventory:physical_inventory_list' %}?search={{ product.name|urlencode }}&field=produto"
                   class="flex items-center gap-2 px-3 py-1 rounded-md border border-orange-500 bg-transparent hover:bg-orange-500/10 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 text-orange-400">
                        <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                    <span class="text-sm font-semibold text-orange-400">{{ on_hand_count|floatformat:'-3' }}</span>
                    <span class="text-xs text-orange-400">Em Stock</span>
                </a>
            </div>
        </div>
    </div>
</div>
