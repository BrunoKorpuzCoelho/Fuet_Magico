<div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center h-14">
            <!-- Left: Nav link + action buttons -->
            <div class="flex items-center space-x-6">
                <a href="{% url 'dashboard:document_sequences' %}"
                   class="text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors">
                    Sequências de Documentos
                </a>

                <!-- Discard + Save — same pattern as contacts -->
                <div class="flex items-center gap-3">
                    <!-- Descartar (vermelho) -->
                    <a href="{% url 'dashboard:document_sequences' %}"
                       class="flex items-center justify-center hover:opacity-80 transition-opacity"
                       title="Descartar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             class="h-5 w-5 text-red-500">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                            <line x1="10" x2="10" y1="11" y2="17"/>
                            <line x1="14" x2="14" y1="11" y2="17"/>
                        </svg>
                    </a>
                    <!-- Gravar (verde) -->
                    <button type="submit"
                            form="seq-form"
                            class="flex items-center justify-center hover:opacity-80 transition-opacity"
                            title="Gravar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             class="h-5 w-5 text-green-500">
                            <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
                            <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/>
                            <path d="M7 3v4a1 1 0 0 0 1 1h7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
