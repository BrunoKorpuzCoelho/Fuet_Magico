<div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-14">
            <!-- Navigation Links -->
            <div class="flex items-center space-x-6">

                <!-- Dashboard (direct link) -->
                <a href="{% url 'financial:index' %}"
                   class="text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors">
                    Dashboard
                </a>

                <!-- Relatórios (dropdown) -->
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open"
                            class="flex items-center space-x-1 text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors">
                        <span>Relatórios</span>
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div x-show="open"
                         @click.away="open = false"
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="opacity-0 scale-95"
                         x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="opacity-100 scale-100"
                         x-transition:leave-end="opacity-0 scale-95"
                         class="absolute left-0 mt-2 w-56 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 z-50"
                         style="display:none;">
                        <div class="py-1">

                            <!-- Resultados -->
                            <div class="px-4 py-2 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">
                                Resultados
                            </div>
                            <a href="{% url 'financial:report_pnl' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                P&amp;L Mensal
                            </a>
                            <a href="{% url 'financial:report_annual_comparison' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Comparativo Anual
                            </a>
                            <a href="{% url 'financial:report_sales_evolution' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Evolução da Receita
                            </a>
                            <a href="{% url 'financial:report_margins' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Margens por Produto
                            </a>

                            <!-- Divider -->
                            <div class="border-t border-gray-200 dark:border-gray-700 my-1"></div>

                            <!-- Vendas -->
                            <div class="px-4 py-2 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">
                                Vendas
                            </div>
                            <a href="{% url 'financial:report_sales_period' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Por Período
                            </a>
                            <a href="{% url 'financial:report_sales_products' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Top Produtos
                            </a>
                            <a href="{% url 'financial:report_sales_clients' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Top Clientes
                            </a>

                            <!-- Divider -->
                            <div class="border-t border-gray-200 dark:border-gray-700 my-1"></div>

                            <!-- Compras & Inventário -->
                            <div class="px-4 py-2 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">
                                Compras &amp; Inventário
                            </div>
                            <a href="{% url 'financial:report_purchases_period' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Compras por Período
                            </a>
                            <a href="{% url 'financial:report_purchases_suppliers' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Top Fornecedores
                            </a>
                            <a href="{% url 'financial:report_stock_losses' %}"
                               class="block pl-8 pr-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                Perdas de Stock
                            </a>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
